<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f6f5f1"/>
  <!-- Geometric composition: concentric rectangles + cross-hairs -->
  <rect x="300" y="100" width="1000" height="600" fill="none" stroke="#111111" stroke-width="1"/>
  <rect x="380" y="180" width="840" height="440" fill="none" stroke="#111111" stroke-width="1" opacity="0.4"/>
  <rect x="460" y="260" width="680" height="280" fill="#111111" opacity="0.04"/>
  <!-- Cross-hair lines -->
  <line x1="800" y1="100" x2="800" y2="700" stroke="#111111" stroke-width="1" opacity="0.12"/>
  <line x1="300" y1="400" x2="1300" y2="400" stroke="#111111" stroke-width="1" opacity="0.12"/>
  <!-- Label -->
  <text x="800" y="800" font-family="system-ui,sans-serif" font-size="14" font-weight="500"
        text-anchor="middle" letter-spacing="0.12em" fill="#111111" opacity="0.4">PLACEHOLDER 03</text>
</svg>
